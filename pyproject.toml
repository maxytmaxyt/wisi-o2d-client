[project]
name = "wisi-o2d-client"
version = "0.2.0"
description = "Reverse-engineered Python client for the WISI OR S2D DVB-over-IP dongle"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
wisi = "wisi:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "protocol",
    "wisi",
    "wisi_channels",
    "wisi_client",
    "wisi_common",
    "wisi_discovery",
    "wisi_epg",
    "wisi_pcap",
    "wisi_probe",
    "wisi_menu",
]

[tool.ruff]
line-length = 100
